name: aeropulse

networks:
  aeropulse-frontend:
  aeropulse-backend:

volumes:
  timescale-data:
  redpanda-data:
  redis-data:
  minio-data:

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aeropulse
      POSTGRES_PASSWORD: aeropulse
      POSTGRES_DB: aeropulse
    volumes:
      - timescale-data:/home/postgres/pgdata/data
      - ../db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
      - ../db/migrations/0002_phase3.sql:/docker-entrypoint-initdb.d/0002_phase3.sql:ro
      - ../db/migrations/0003_phase4.sql:/docker-entrypoint-initdb.d/0003_phase4.sql:ro
      - ../db/migrations/0004_raster_observation.sql:/docker-entrypoint-initdb.d/0004_raster_observation.sql:ro
      - ../db/migrations/0005_shadow_prediction.sql:/docker-entrypoint-initdb.d/0005_shadow_prediction.sql:ro
      - ../db/migrations/0006_alert.sql:/docker-entrypoint-initdb.d/0006_alert.sql:ro
      - ../db/migrations/0007_source_health_run.sql:/docker-entrypoint-initdb.d/0007_source_health_run.sql:ro
      - ../db/migrations/0008_meteo_forecast.sql:/docker-entrypoint-initdb.d/0008_meteo_forecast.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    networks: [aeropulse-backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeropulse -d aeropulse"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g

  # Init scripts under /docker-entrypoint-initdb.d run only on first volume
  # create. This job re-applies the same idempotent SQL on every `up`.
  migrate:
    image: timescale/timescaledb-ha:pg16
    restart: "no"
    environment:
      PGPASSWORD: aeropulse
    volumes:
      - ../db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for f in /migrations/*.sql; do
          echo "migrate: $$f"
          psql -h timescaledb -U aeropulse -d aeropulse -v ON_ERROR_STOP=1 -f "$$f"
        done
    depends_on:
      timescaledb:
        condition: service_healthy
    networks: [aeropulse-backend]
    mem_limit: 256m

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.11
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:19092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --schema-registry-addr
      - 0.0.0.0:8081
      - --smp
      - "1"
      - --memory
      - 512M
      - --mode
      - dev-container
      - --default-log-level=warn
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:8081:8081"
    networks: [aeropulse-backend]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 768m

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks: [aeropulse-backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  minio:
    # minio/minio was removed from Docker Hub in September 2026, and
    # quay.io/minio/minio now returns 401 to anonymous pulls. This Bitnami
    # legacy tag is the same community server, still pullable, with the
    # stock entrypoint (do not override command). Data lives under
    # /bitnami/minio/data.
    image: bitnamilegacy/minio:2025.7.23
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: aeropulse
      MINIO_ROOT_PASSWORD: aeropulse_secret
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [aeropulse-backend]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "aeropulse-api"]
    environment:
      AEROPULSE_SERVICE_NAME: aeropulse-api
      AEROPULSE_DATABASE_URL: postgresql://aeropulse:aeropulse@timescaledb:5432/aeropulse
      AEROPULSE_REDIS_URL: redis://redis:6379/0
      AEROPULSE_MINIO_ENDPOINT: minio:9000
      # Same local-dev MinIO root user as the minio service above. Compose
      # injects these so put_raw_json can write; they are not production secrets.
      AEROPULSE_MINIO_ACCESS_KEY: aeropulse
      AEROPULSE_MINIO_SECRET_KEY: aeropulse_secret
      AEROPULSE_JWT_SECRET: ${AEROPULSE_JWT_SECRET:?AEROPULSE_JWT_SECRET is required}
      # Copilot only. Server-side: this must never reach the web bundle.
      # Absent means the copilot degrades to deterministic retrieval.
      AEROPULSE_GEMINI_API_KEY: ${AEROPULSE_GEMINI_API_KEY:-}
      AEROPULSE_GEMINI_MODEL: ${AEROPULSE_GEMINI_MODEL:-gemini-3.8-flash}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [aeropulse-frontend, aeropulse-backend]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 512m

  drift-monitor:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "aeropulse-drift-monitor"]
    environment:
      AEROPULSE_SERVICE_NAME: aeropulse-drift-monitor
      AEROPULSE_JWT_SECRET: ${AEROPULSE_JWT_SECRET:?AEROPULSE_JWT_SECRET is required}
      AEROPULSE_DATABASE_URL: postgresql://aeropulse:aeropulse@timescaledb:5432/aeropulse
      AEROPULSE_DRIFT_MONITOR_INTERVAL_SECONDS: 3600
      AEROPULSE_DRIFT_MONITOR_REFERENCE_HOURS: 168
      AEROPULSE_DRIFT_MONITOR_CURRENT_HOURS: 24
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [aeropulse-backend]
    mem_limit: 256m

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "aeropulse-worker"]
    environment:
      AEROPULSE_SERVICE_NAME: aeropulse-worker
      AEROPULSE_JWT_SECRET: ${AEROPULSE_JWT_SECRET:?AEROPULSE_JWT_SECRET is required}
      AEROPULSE_DATABASE_URL: postgresql://aeropulse:aeropulse@timescaledb:5432/aeropulse
      AEROPULSE_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Prometheus scrape port for worker domain counters. Bind localhost only.
      AEROPULSE_WORKER_METRICS_PORT: 9090
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    networks: [aeropulse-backend]
    mem_limit: 512m

  connector:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    # The connector is now a scheduled loop, not a one-shot job.
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["uv", "run", "aeropulse-connector"]
    environment:
      AEROPULSE_JWT_SECRET: ${AEROPULSE_JWT_SECRET:?AEROPULSE_JWT_SECRET is required}
      AEROPULSE_SERVICE_NAME: aeropulse-connector
      AEROPULSE_CONNECTOR_MODE: ${AEROPULSE_CONNECTOR_MODE:-replay}
      AEROPULSE_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Required for connector_checkpoint reads/writes. Without it
      # runner._checkpoint_repository() returns None and every cycle restarts
      # from cursor zero, so live sources can never resume where they left off.
      AEROPULSE_DATABASE_URL: postgresql://aeropulse:aeropulse@timescaledb:5432/aeropulse
      AEROPULSE_MINIO_ENDPOINT: minio:9000
      AEROPULSE_MINIO_ACCESS_KEY: aeropulse
      AEROPULSE_MINIO_SECRET_KEY: aeropulse_secret
      AEROPULSE_OPENAQ_API_KEY: ${AEROPULSE_OPENAQ_API_KEY:-}
      AEROPULSE_FIRMS_MAP_KEY: ${AEROPULSE_FIRMS_MAP_KEY:-}
    depends_on:
      redpanda:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [aeropulse-backend]
    mem_limit: 256m

  web:
    build:
      context: ../../frontend/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # The browser runs on the host, so this is the host-published API port,
      # not the compose service name.
      VITE_API_BASE: http://127.0.0.1:8000
      # Bearer token for Live. Empty leaves Live disabled with a reason, instead
      # of sending a token the API rejects. Mint one into .env:
      #   uv run python -c "from aeropulse_auth import encode_token, Role; print(encode_token('ui', [Role.VIEWER]))"
      # `AEROPULSE_WEB_TOKEN` and `AEROPULSE_UI_TOKEN` are both accepted.
      VITE_API_TOKEN: ${AEROPULSE_WEB_TOKEN:-${AEROPULSE_UI_TOKEN:-}}
      # Demo is the landing state: the scripted narrative is what the product
      # demonstrates, and it works with no backend at all. The toggle switches
      # to live.
      VITE_DEFAULT_DATA_MODE: ${AEROPULSE_UI_MODE:-demo}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    networks: [aeropulse-frontend]
    mem_limit: 1g
