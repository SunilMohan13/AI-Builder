# Builds the static web image in Cloud Build with the API address and a
# read-only demo token baked in, and pushes it to Artifact Registry. Run from
# the repository root after the app image exists and Terraform has created
# the API:
#
#   gcloud builds submit --config infrastructure/gcp/cloudbuild/web.yaml \
#     --region $LOCATION --service-account $BUILD_SA_ID \
#     --substitutions _LOCATION=$LOCATION,_TAG=$TAG,_APP_TAG=$TAG,_API_URL=$API_URL .
#
# The token is minted inside the build with the app image and the JWT secret
# from Secret Manager; it is never printed. It ends up in the public
# JavaScript bundle by design, so it is read-only (the API refuses its
# writes) and expires after _TOKEN_DAYS. See
# docs/ops/deploy-google-cloud-step-by-step.md.

substitutions:
  _LOCATION: asia-south1
  _TAG: manual
  _APP_TAG: manual
  _API_URL: ""
  _DEFAULT_REGION: in-north
  _DATA_MODE: demo
  _TOKEN_DAYS: "14"

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/aeropulse-jwt-secret/versions/latest
      env: AEROPULSE_JWT_SECRET

steps:
  - id: mint-demo-token
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ["AEROPULSE_JWT_SECRET"]
    args:
      - -c
      - |
        set -euo pipefail
        test -n "${_API_URL}" || { echo "_API_URL is empty: pass the Terraform output api_url"; exit 1; }
        docker run --rm -e AEROPULSE_JWT_SECRET -e AEROPULSE_ENVIRONMENT=production \
          ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/aeropulse/app:${_APP_TAG} \
          python -c "from aeropulse_auth import encode_token, Role; print(encode_token('public-demo', [Role.VIEWER], ttl_seconds=${_TOKEN_DAYS}*86400, read_only=True))" \
          > /workspace/demo_token
        test -s /workspace/demo_token || { echo "token was not minted"; exit 1; }
        echo "demo token minted (not shown)"

  - id: build-web
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - -c
      - |
        set -euo pipefail
        docker build --file=frontend/web/Dockerfile.prod \
          --build-arg=VITE_API_BASE=${_API_URL} \
          --build-arg=VITE_DEFAULT_REGION=${_DEFAULT_REGION} \
          --build-arg=VITE_DEFAULT_DATA_MODE=${_DATA_MODE} \
          --build-arg=VITE_API_TOKEN="$$(cat /workspace/demo_token)" \
          --tag=${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/aeropulse/web:${_TAG} \
          frontend/web
        rm -f /workspace/demo_token

images:
  - ${_LOCATION}-docker.pkg.dev/${PROJECT_ID}/aeropulse/web:${_TAG}

timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
