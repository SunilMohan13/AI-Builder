[project]
name = "aeropulse-connector-nea"
version = "0.1.0"
description = "NEA one-hour PM2.5 from data.gov.sg (no credential required)"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-common",
    "aeropulse-contracts",
    "aeropulse-connector-sdk",
]

[project.entry-points."aeropulse.connectors"]
nea = "aeropulse_connector_nea.plugin:NeaPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel.force-include]
"aeropulse_connector_nea/metadata.yaml" = "aeropulse_connector_nea/metadata.yaml"

[tool.uv.sources]
aeropulse-common = { workspace = true }
aeropulse-contracts = { workspace = true }
aeropulse-connector-sdk = { workspace = true }
