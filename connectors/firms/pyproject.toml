[project]
name = "aeropulse-connector-firms"
version = "0.1.0"
description = "NASA FIRMS active-fire connector"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-common",
    "aeropulse-contracts",
    "aeropulse-connector-sdk",
    "aeropulse-observability",
]

[project.entry-points."aeropulse.connectors"]
firms = "aeropulse_connector_firms.plugin:FirmsPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel.force-include]
"aeropulse_connector_firms/metadata.yaml" = "aeropulse_connector_firms/metadata.yaml"

[tool.uv.sources]
aeropulse-common = { workspace = true }
aeropulse-contracts = { workspace = true }
aeropulse-connector-sdk = { workspace = true }
aeropulse-observability = { workspace = true }
