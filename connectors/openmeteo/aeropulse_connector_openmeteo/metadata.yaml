connector_id: openmeteo
version: 1.0.0
provider: Open-Meteo
data_type: air_quality_and_weather
transport: https
schedule:
  mode: interval
  interval_seconds: 3600
auth:
  type: none
  note: >
    Anonymous public API. This is the only source in the integration matrix
    that needs no credential, which is why it carries the live-path validation.
capabilities:
  realtime: true
  historical: true
  live_verified: true
licensing:
  attribution: "Weather and air quality data by Open-Meteo.com"
  terms: https://open-meteo.com/en/terms
  note: >
    Non-commercial use is free under CC-BY-4.0; commercial deployment requires
    review per LLD caveat 65.1 before production use.
scientific_caveats:
  - >
    Air quality values are CAMS-derived model output, not ground reference
    measurements. Use as background/prior per LLD section 9, never as CPCB
    ground truth.
  - >
    aerosol_optical_depth is dimensionless and is never mapped to a surface
    PM2.5 measurement (LLD section 18.1 and caveat 65.5).
output_contract:
  - observation.v1
  - meteo.v1
