[project]
name = "aeropulse-connector-earthengine"
version = "0.1.0"
description = "Google Earth Engine connector: Sentinel-5P aerosol index and WorldPop"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-common",
    "aeropulse-contracts",
    "aeropulse-connector-sdk",
    "aeropulse-observability",
    "h3>=4.1.0",
]

[project.optional-dependencies]
live = ["earthengine-api>=1.0.0"]

[project.entry-points."aeropulse.connectors"]
earthengine = "aeropulse_connector_earthengine.plugin:EarthEnginePlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
aeropulse-common = { workspace = true }
aeropulse-contracts = { workspace = true }
aeropulse-connector-sdk = { workspace = true }
aeropulse-observability = { workspace = true }
