[project]
name = "aeropulse-cycle"
version = "0.1.0"
description = "Hourly region cycle: ingest, preprocess, detect, serve models, write the snapshot"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-common",
    "aeropulse-contracts",
    "aeropulse-connector-sdk",
    "aeropulse-geospatial",
    "aeropulse-intelligence",
    "aeropulse-ml",
    "aeropulse-observability",
    "aeropulse-regions",
    "aeropulse-storage",
    "h3>=4.1.0",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aeropulse_cycle"]

[project.scripts]
aeropulse-cycle = "aeropulse_cycle.main:main"

[tool.uv.sources]
aeropulse-common = { workspace = true }
aeropulse-contracts = { workspace = true }
aeropulse-connector-sdk = { workspace = true }
aeropulse-geospatial = { workspace = true }
aeropulse-intelligence = { workspace = true }
aeropulse-ml = { workspace = true }
aeropulse-observability = { workspace = true }
aeropulse-regions = { workspace = true }
aeropulse-storage = { workspace = true }
