[project]
name = "aeropulse-worker"
version = "0.1.0"
description = "Consume observation topics and persist events"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-common",
    "aeropulse-contracts",
    "aeropulse-connector-sdk",
    "aeropulse-geospatial",
    "aeropulse-observability",
    "aeropulse-intelligence",
    "aeropulse-ml",
    "aiokafka>=0.11.0",
    "psycopg[binary]>=3.2.0",
    "prometheus-client>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.scripts]
aeropulse-worker = "aeropulse_worker.main:main"

[tool.uv.sources]
aeropulse-common = { workspace = true }
aeropulse-contracts = { workspace = true }
aeropulse-connector-sdk = { workspace = true }
aeropulse-geospatial = { workspace = true }
aeropulse-observability = { workspace = true }
aeropulse-intelligence = { workspace = true }
aeropulse-ml = { workspace = true }
