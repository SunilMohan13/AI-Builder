[project]
name = "aeropulse-api"
version = "0.1.0"
description = "AeroPulse FastAPI BFF: map, sources, events"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-common",
    "aeropulse-auth",
    "aeropulse-observability",
    "aeropulse-contracts",
    "aeropulse-intelligence",
    "aeropulse-copilot",
    "aeropulse-ml",
    "aeropulse-geospatial",
    "aeropulse-connector-app",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.scripts]
aeropulse-api = "aeropulse_api.main:main"
aeropulse-drift-monitor = "aeropulse_api.drift_monitor:main"

[tool.uv.sources]
aeropulse-common = { workspace = true }
aeropulse-auth = { workspace = true }
aeropulse-observability = { workspace = true }
aeropulse-contracts = { workspace = true }
aeropulse-intelligence = { workspace = true }
aeropulse-copilot = { workspace = true }
aeropulse-ml = { workspace = true }
aeropulse-geospatial = { workspace = true }
aeropulse-connector-app = { workspace = true }
