[project]
name = "aeropulse-citizen-analyzer"
version = "0.1.0"
description = "Citizen report analyzer: sanitize, geo-trust, AI visual observation, corroboration, decision"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-auth",
    "aeropulse-common",
    "aeropulse-contracts",
    "aeropulse-intelligence",
    "aeropulse-ml",
    "aeropulse-observability",
    "aeropulse-regions",
    "aeropulse-storage",
    "aeropulse-vision",
    "fastapi>=0.115.0",
    "h3>=4.1.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aeropulse_citizen_analyzer"]

[project.scripts]
aeropulse-citizen = "aeropulse_citizen_analyzer.main:main"

[tool.uv.sources]
aeropulse-auth = { workspace = true }
aeropulse-common = { workspace = true }
aeropulse-contracts = { workspace = true }
aeropulse-intelligence = { workspace = true }
aeropulse-ml = { workspace = true }
aeropulse-observability = { workspace = true }
aeropulse-regions = { workspace = true }
aeropulse-storage = { workspace = true }
aeropulse-vision = { workspace = true }
