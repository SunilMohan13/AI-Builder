<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AeroPulse — how it works</title>
  <meta name="description" content="Click through how AeroPulse ingests data, scores pollution events, and what the operator map actually shows." />
  <meta name="theme-color" content="#0061FF" />
  <style>
    :root {
      --ink: #0f2744;
      --muted: #4a6480;
      --line: #c5d8ec;
      --live: #0061FF;
      --cyan: #60EFFF;
      --det: #0d9f7a;
      --ml: #e06b1f;
      --llm: #6d4aff;
      --rose: #c43d4b;
      --panel: rgba(255, 255, 255, 0.86);
      --panel-2: #f3f9ff;
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    html, body {
      margin: 0; height: 100%; color: var(--ink);
      font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #eaf4ff 0%, #d7f7ff 42%, #c5eeff 100%);
    }
    .skip {
      position: absolute; left: 0.75rem; top: -3rem; z-index: 20;
      background: #fff; color: var(--live); padding: 0.4rem 0.7rem; border-radius: 6px; font-weight: 700;
    }
    .skip:focus { top: 0.6rem; }
    button { font: inherit; cursor: pointer; }
    .controls button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .hop:focus-visible, .chip:focus-visible, .dnode:focus { outline: 3px solid var(--live); outline-offset: 2px; }
    code {
      font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; font-size: 0.84em;
      background: #e4f1ff; padding: 0.05em 0.32em; border-radius: 3px; color: #0b3d8c;
    }
    a { color: var(--live); }

    .app { min-height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; }

    header {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: 0.85rem 1.25rem; color: #fff;
      background: linear-gradient(90deg, #0061FF, #60EFFF);
    }
    .brand { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
    .brand h1 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; }
    .brand p { margin: 0; color: rgba(255, 255, 255, 0.88); font-size: 0.78rem; }
    .controls { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
    .controls button, .hint {
      background: rgba(255, 255, 255, 0.18); color: #fff; border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 6px; padding: 0.38rem 0.7rem; font-size: 0.8rem; font-weight: 600;
    }
    .controls button:hover, .controls button:focus-visible { background: rgba(255, 255, 255, 0.32); outline: none; }
    .controls button.primary { background: #fff; color: #0061FF; border-color: #fff; }
    .controls button[aria-pressed="true"] { background: #0d9f7a; color: #fff; border-color: #fff; }
    .hint { color: rgba(255, 255, 255, 0.9); font-weight: 500; }

    .rail {
      display: flex; gap: 0.35rem; padding: 0.7rem 1.1rem; overflow-x: auto;
      background: rgba(255, 255, 255, 0.55); border-bottom: 1px solid var(--line);
    }
    .hop {
      flex: 1 0 7.2rem; min-width: 7.2rem; text-align: left;
      background: #fff; border: 1px solid var(--line); border-radius: 8px;
      padding: 0.55rem 0.6rem; color: var(--ink);
    }
    .hop:hover, .hop:focus-visible { border-color: var(--live); outline: none; }
    .hop[aria-current="step"] { border-color: var(--live); box-shadow: 0 0 0 2px rgba(0, 97, 255, 0.25); background: #e8f2ff; }
    .hop .n { display: block; font-size: 0.68rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .hop .t { display: block; font-size: 0.82rem; font-weight: 700; margin-top: 0.15rem; }
    .hop.ml[aria-current="step"] { border-color: var(--ml); background: #fff1e4; box-shadow: 0 0 0 2px rgba(224, 107, 31, 0.22); }
    .hop.det-hop[aria-current="step"] { border-color: var(--det); background: #e5fbf3; box-shadow: 0 0 0 2px rgba(13, 159, 122, 0.22); }
    .hop.side[aria-current="step"] { border-color: var(--llm); background: #f3eeff; }

    .stage { padding: 1.15rem 1.25rem 1.6rem; max-width: 1180px; width: 100%; margin: 0 auto; }
    .diagram {
      background: rgba(255, 255, 255, 0.78); border: 1px solid var(--line); border-radius: 10px;
      overflow-x: auto; margin: 0 0 1rem; padding: 0.5rem 0.6rem 0.3rem;
    }
    .diagram figcaption {
      color: var(--muted); font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase;
      margin: 0.1rem 0.3rem 0.45rem;
    }
    .legend {
      display: flex; flex-wrap: wrap; gap: 0.45rem 1rem; margin: 0 0.3rem 0.55rem;
      padding: 0; list-style: none; font-size: 0.72rem; font-weight: 600; color: var(--muted);
    }
    .legend li { display: flex; align-items: center; gap: 0.35rem; }
    .legend i { display: inline-block; width: 0.7rem; height: 0.7rem; border-radius: 3px; margin-right: 0.3rem; vertical-align: -1px; border: 1px solid rgba(15, 39, 68, 0.15); }
    .legend .live i { background: linear-gradient(90deg, #0061FF, #60EFFF); }
    .legend .det i { background: #b7f0dc; border-color: var(--det); }
    .legend .ml i { background: #ffd2a8; border-color: var(--ml); }
    .legend .llm i { background: #ddd4ff; border-color: var(--llm); }
    .legend .store i { background: #e7edf5; border-color: #5b6d8a; }
    .legend .ghost i { background: #f4f6f8; border-color: #9aa6b5; }
    .diagram svg { display: block; width: 100%; height: auto; min-width: 920px; }
    .dnode { cursor: pointer; }
    .dnode rect, .dnode polygon { fill: #fff; stroke: #8aa7c4; stroke-width: 1.3; }
    .dnode.on rect, .dnode.on polygon { stroke-width: 2.4; filter: drop-shadow(0 2px 6px rgba(0, 97, 255, 0.25)); }
    .dnode.live rect { fill: #d9efff; stroke: #0061FF; }
    .dnode.det rect, .dnode.det polygon { fill: #d4f6ea; stroke: var(--det); }
    .dnode.ml rect { fill: #ffe4cc; stroke: var(--ml); }
    .dnode.llm rect { fill: #ece4ff; stroke: var(--llm); }
    .dnode.store rect { fill: #eef2f8; stroke: #5b6d8a; }
    .dnode.ghost rect { fill: #f4f6f8; stroke: #9aa6b5; stroke-dasharray: 5 4; }
    .dnode.demo rect { fill: #f6eefc; stroke: #9b7bb8; }
    .dnode text { fill: var(--ink); font-size: 12px; font-weight: 600; pointer-events: none; }
    .dnode .sub { fill: var(--muted); font-size: 10px; font-weight: 500; }
    .edge { stroke: #8aa7c4; stroke-width: 1.45; fill: none; marker-end: url(#arr); }
    .edge.live {
      stroke: #0061FF; stroke-width: 2.3; stroke-dasharray: 9 7;
      animation: flow 0.9s linear infinite; marker-end: url(#arr-live);
    }
    .edge.det { stroke: var(--det); stroke-width: 2; marker-end: url(#arr-det); }
    .edge.ml { stroke: var(--ml); stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#arr-ml); }
    .edge.llm { stroke: var(--llm); marker-end: url(#arr-llm); }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) {
      .edge.live { animation: none; stroke-dasharray: none; }
      .pulse { animation: none; }
    }
    .lab { fill: var(--muted); font-size: 10px; }
    .note { fill: var(--rose); font-size: 10px; }
    .kicker { color: var(--live); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 0.35rem; }
    .kicker.amber { color: var(--ml); }
    .kicker.rose { color: var(--rose); }
    .stage h2 { margin: 0 0 0.45rem; font-size: 1.45rem; letter-spacing: -0.03em; }
    .lede { margin: 0 0 0.85rem; color: var(--muted); max-width: 48rem; }
    .stage:focus { outline: none; }
    .svg-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
    .grid2 { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 0.85rem; }
    @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0.9rem 1rem;
    }
    .card h3 { margin: 0 0 0.5rem; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .card ul, .card ol { margin: 0; padding-left: 1.1rem; }
    .card li { margin: 0.28rem 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
    .chip {
      background: #fff; border: 1px solid var(--line); color: var(--ink);
      border-radius: 999px; padding: 0.28rem 0.65rem; font-size: 0.75rem; font-weight: 600;
    }
    .chip:hover, .chip:focus-visible { border-color: var(--live); outline: none; }
    .chip[aria-pressed="true"] { background: #e8f2ff; border-color: var(--live); color: var(--live); }

    .detail {
      margin-top: 0.85rem; background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 10px; padding: 0.85rem 1rem; min-height: 5.5rem;
    }
    .detail h4 { margin: 0 0 0.35rem; font-size: 0.95rem; }
    .detail p { margin: 0; color: var(--muted); }
    .paths { margin-top: 0.55rem; display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .paths code { display: inline-block; }

    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    th, td { text-align: left; padding: 0.4rem 0.45rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .tag { display: inline-block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.1rem 0.38rem; border-radius: 3px; }
    .on { background: #d4f6ea; color: var(--det); }
    .off { background: #ffe4cc; color: var(--ml); }
    .never { background: #fde4e6; color: var(--rose); }

    footer {
      display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
      padding: 0.55rem 1.25rem; border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.7); color: var(--muted); font-size: 0.75rem;
    }
    .progress { flex: 1; min-width: 10rem; height: 4px; background: #cfe8ff; border-radius: 99px; align-self: center; }
    .progress > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #0061FF, #60EFFF); border-radius: 99px; transition: width 0.25s ease; }

    .hidden { display: none !important; }
    .pulse { animation: pulse 1.1s ease-in-out 1; }
    @keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.03); } 100% { transform: scale(1); } }

    @media print {
      html, body { background: #fff; color: #111; height: auto; }
      .skip, .controls, .rail, .svg-defs { display: none !important; }
      header { background: #0061FF; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .stage { max-width: none; }
      .card, .detail, .diagram { background: #fff; color: #111; border-color: #ccc; }
      .edge.live { animation: none; stroke-dasharray: none; }
    }
  </style>
</head>
<body>

  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">

      <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#8aa7c4"/></marker>
      <marker id="arr-live" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#0061FF"/></marker>
      <marker id="arr-det" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#0d9f7a"/></marker>
      <marker id="arr-ml" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#e06b1f"/></marker>
      <marker id="arr-llm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><polygon points="0 0, 8 4, 0 8" fill="#6d4aff"/></marker>
    </defs>
  </svg>
  <div class="app">
    <header>
      <div class="brand">
        <h1>How AeroPulse works</h1>
        <p>Click Play, use the arrows, or tap a coloured box</p>
      </div>
      <nav class="controls" aria-label="Walkthrough">
        <button type="button" id="btn-prev" aria-label="Previous hop">← Prev</button>
        <button type="button" id="btn-play" class="primary" aria-pressed="false">Play walkthrough</button>
        <button type="button" id="btn-next" aria-label="Next hop">Next →</button>
        <span class="hint">Arrow keys · space to play · click a coloured box</span>
      </nav>
    </header>

    <nav class="rail" id="rail" aria-label="Pipeline hops"></nav>

    <main class="stage" id="stage" tabindex="-1" aria-live="polite"></main>

    <footer>
      <span id="foot-label">Hop 1 of 15</span>
      <div class="progress" id="barwrap" role="progressbar" aria-valuemin="1" aria-valuemax="15" aria-valuenow="1" aria-label="Walkthrough progress"><i id="bar"></i></div>
      <span>Cyan live path · Green served rules · Orange trained boosting (not served) · Violet copilot</span>
    </footer>
  </div>
  <noscript>
    <p style="padding:1rem;font-family:sans-serif">This walkthrough needs JavaScript. Static notes: connector → bus → worker (IDW/rules) → database → API → Live UI. Trained boosting is shadow/train only. Copilot is the only language-model surface.</p>
  </noscript>

  <script>
    const HOPS = [
      {
        id: "brief",
        n: "00",
        t: "Briefing",
        kicker: "Scope",
        title: "How to read this walkthrough",
        lede: "Fifteen hops from ingest to the operator UI. Use Play, the arrow keys, or click a coloured box. Cyan moving arrows are the live serving path. Green boxes are the rules that actually answer. Orange is trained gradient boosting (not what the operator sees). Violet is the copilot.",
        left: {
          h: "How to present",
          html: "<ol><li>Start on <strong>Stack</strong> for how Compose is packed.</li><li>Open <strong>Flowchart</strong> and follow one observation.</li><li>Stop on <strong>Models</strong> so IDW is not confused with trained gradient boosting.</li></ol>"
        },
        right: {
          h: "Out of this runtime",
          html: "<p><span class='tag never'>Not here</span> live Sentinel / MODIS / CAMS HTTP, citizen computer vision, OIDC, MLflow, calibrated hazard probabilities, quantile P10/P90 fitting.</p>"

      },
      {

        left: {

          html: "<ul><li>Connectors stay one process with a yaml registry and a scheduler.</li><li>Quality, grid, scoring, persist, and shadow live in the worker.</li><li>The API is read-only over Timescale. Copilot is inside the API process, not a fourth container.</li></ul>"

      },
      {
        id: "flow",
        n: "02",
        t: "Flowchart",
        kicker: "Control flow",
        title: "One observation through the stack",
        lede: "Decision diamonds are the quality gate, the detection trigger, and Live vs Demo. Cyan moving arrows are the live serving path. Orange dashed arrows are trained HGB shadow — after persist, never on the user response.",
        diagram: "flow",
        left: {
          h: "What this chart is not",
          html: "<ul><li>Not 19 bus topics — the worker consumes four.</li><li>Not per-message detection on live volume — scoring is batched.</li><li>Not trained boosting on the event path — IDW + rules.</li></ul>"
        },
        right: {
          h: "What you can watch",
          html: "<p>Worker metrics are on <code>:9090</code>. Replay stays on this machine. A live Open-Meteo fetch waits on that service.</p>"
        }
      },
      {
        id: "connector",
        n: "03",
        t: "Connector",
        kicker: "Ingest",
        title: "Scheduled fetch, not a one-shot job",

    function hopOn(go) {
      const hid = HOPS[i].id;
      const map = {
        connector: ["connector"],
        normalize: ["connector"],
        minio: ["minio"],
        kafka: ["kafka"],
        worker: ["worker"],
        score: ["score", "worker"],
        shadow: ["shadow"],
        timescale: ["timescale"],
        api: ["api"],
        ui: ["ui"],
        ml: ["ml", "shadow"],
        side: ["side"]
      };
      return (map[hid] || []).includes(go);

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function box(x, y, w, h, go, title, sub, kind) {
      const on = hopOn(go) ? " on" : "";
      const bar = {
        live: "#0061FF", det: "#0d9f7a", ml: "#e06b1f", llm: "#6d4aff"
      }[kind];
      const stripe = bar ? `<rect width="7" height="${h}" rx="3" fill="${bar}"/>` : "";
      const tip = `${title} — ${sub}. Opens the ${go} hop.`;
      return `<g class="dnode ${kind || ""}${on}" data-go="${go}" tabindex="0" role="link" aria-label="${esc(tip)}" transform="translate(${x} ${y})">
        <title>${esc(tip)}</title>
        <rect width="${w}" height="${h}" rx="8"/>
        ${stripe}
        <text x="14" y="22">${esc(title)}</text>
        <text class="sub" x="14" y="40">${esc(sub)}</text>
      </g>`;
    }

    function diamond(x, y, w, h, go, title) {
      const on = hopOn(go) ? " on" : "";
      const mx = w / 2, my = h / 2;
      const tip = `Decision: ${title}`;
      return `<g class="dnode live${on}" data-go="${go}" tabindex="0" role="link" aria-label="${esc(tip)}" transform="translate(${x} ${y})">
        <title>${esc(tip)}</title>
        <polygon points="${mx},0 ${w},${my} ${mx},${h} 0,${my}"/>
        <text x="${mx}" y="${my + 4}" text-anchor="middle">${esc(title)}</text>
      </g>`;
    }

      rail.innerHTML = HOPS.map((h, idx) => {

        if (h.id === "side" || h.id === "flow") cls.push("side");
        const current = idx === i ? ' aria-current="step"' : "";
        return `<button type="button" class="${cls.join(" ")}" data-i="${idx}"${current}><span class="n">${h.n}</span><span class="t">${h.t}</span></button>`;

    function renderStage() {
      const h = HOPS[i];
      const kickerCls = h.id === "ml" || h.id === "shadow" ? "kicker amber" : "kicker";
      stage.innerHTML = `
        <p class="${kickerCls}">${h.kicker} · hop ${h.n} of ${String(HOPS.length - 1).padStart(2, "0")}</p>
        <h2>${h.title}</h2>

        ${h.diagram || h.scoring || h.ml ? diagramFor(h) : ""}

          <section class="card"><h3>${h.left.h}</h3>${h.left.html}</section>
          <section class="card"><h3>${h.right.h}</h3>${h.right.html}</section>
        </div>
        ${h.scoring ? `<div class="card" style="margin-top:.85rem"><h3>Scoring core — click a step</h3><div class="chips">${scorePanel()}</div></div>` : ""}
        ${h.ml ? `<div class="card" style="margin-top:.85rem"><h3>Served versions vs trained families</h3>${mlPanel()}</div>` : ""}
      `;
      stage.classList.remove("pulse");
      void stage.offsetWidth;
      stage.classList.add("pulse");
      foot.textContent = `Hop ${i + 1} of ${HOPS.length} — ${h.t}`;
      bar.style.width = `${((i + 1) / HOPS.length) * 100}%`;
      const barwrap = document.getElementById("barwrap");
      if (barwrap) {
        barwrap.setAttribute("aria-valuenow", String(i + 1));
        barwrap.setAttribute("aria-valuemax", String(HOPS.length));
      }
      history.replaceState(null, "", "#" + h.id);
    }

    function stopPlay() {
      if (!timer) return;
      clearInterval(timer);
      timer = null;
      btnPlay.setAttribute("aria-pressed", "false");
      btnPlay.textContent = "Play walkthrough";
    }

    function go(n, { auto } = {}) {
      if (!auto) stopPlay();
      i = (n + HOPS.length) % HOPS.length;
      renderRail();
      renderStage();
    }

    function playToggle() {
      if (timer) {
        stopPlay();
        return;
      }
      btnPlay.setAttribute("aria-pressed", "true");
      btnPlay.textContent = "Pause";
      timer = setInterval(() => go(i + 1, { auto: true }), 4200);
    }

    rail.addEventListener("click", (e) => {
      const b = e.target.closest("[data-i]");
      if (!b) return;
      go(Number(b.dataset.i));
    });
    document.getElementById("btn-prev").addEventListener("click", () => go(i - 1));
    document.getElementById("btn-next").addEventListener("click", () => go(i + 1));
    btnPlay.addEventListener("click", playToggle);

    stage.addEventListener("click", (e) => {
      const jump = e.target.closest("[data-go]");
      if (jump) {
        const idx = HOPS.findIndex((h) => h.id === jump.dataset.go);
        if (idx >= 0) go(idx);
        return;
      }
      const s = e.target.closest("[data-score]");
      if (s) {
        scoreKey = s.dataset.score;
        renderStage();
        return;
      }
      const m = e.target.closest("[data-ml]");
      if (m) {
        mlKey = m.dataset.ml;
        renderStage();
      }
    });

    document.addEventListener("keydown", (e) => {
      const tag = e.target.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      const onNode = e.target.closest("[data-go], [data-score], [data-ml]");
      if ((e.key === "Enter" || e.key === " ") && onNode && onNode.tagName.toLowerCase() === "g") {
        e.preventDefault();
        onNode.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        return;
      }
      if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(i + 1); }
      if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(i - 1); }
      if (e.key === " " && tag !== "BUTTON" && tag !== "A") {
        e.preventDefault();
        playToggle();
      }
      if (e.key === "Home") { e.preventDefault(); go(0); }
      if (e.key === "End") { e.preventDefault(); go(HOPS.length - 1); }
    });

    const fromHash = HOPS.findIndex((h) => "#" + h.id === location.hash);
    i = fromHash >= 0 ? fromHash : 0;
    renderRail();
    renderStage();
  </script>
</body>
</html>
