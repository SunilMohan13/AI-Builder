[project]
name = "aeropulse-intelligence"
version = "0.1.0"
description = "Deterministic grid features, anomaly, source likelihood, event engine"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-common",
    "aeropulse-contracts",
    "aeropulse-geospatial",
    "aeropulse-observability",
    "h3>=4.1.0",
    "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
aeropulse-common = { workspace = true }
aeropulse-contracts = { workspace = true }
aeropulse-geospatial = { workspace = true }
aeropulse-observability = { workspace = true }
