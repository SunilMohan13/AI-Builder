[project]
name = "aeropulse-intelligence"
version = "0.1.0"
description = "Deterministic grid features, anomaly, source likelihood, event engine"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-common",
    "aeropulse-contracts",
    "aeropulse-geospatial",
    "aeropulse-regions",
    "h3>=4.1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
aeropulse-common = { workspace = true }
aeropulse-contracts = { workspace = true }
aeropulse-geospatial = { workspace = true }
aeropulse-regions = { workspace = true }
