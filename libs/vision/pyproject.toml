[project]
name = "aeropulse-vision"
version = "0.1.0"
description = "Citizen photo sanitising, geo-trust, and the AI visual observer (labelled, never on the event path)"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-common",
    "aeropulse-contracts",
    "aeropulse-observability",
    "aeropulse-regions",
    "h3>=4.1.0",
    "pillow>=10.4",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aeropulse_vision"]

[tool.hatch.build.targets.wheel.force-include]
"aeropulse_vision/prompts/observer_v1.md" = "aeropulse_vision/prompts/observer_v1.md"

[tool.uv.sources]
aeropulse-common = { workspace = true }
aeropulse-contracts = { workspace = true }
aeropulse-observability = { workspace = true }
aeropulse-regions = { workspace = true }
