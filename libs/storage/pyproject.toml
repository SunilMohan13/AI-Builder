[project]
name = "aeropulse-storage"
version = "0.1.0"
description = "Object, analytics and snapshot storage adapters (local and Google Cloud)"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-common",
    "aeropulse-contracts",
    "aeropulse-observability",
    "minio>=7.2.0",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-storage>=2.18",
    "google-cloud-bigquery>=3.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aeropulse_storage"]

[tool.uv.sources]
aeropulse-common = { workspace = true }
aeropulse-contracts = { workspace = true }
aeropulse-observability = { workspace = true }
