[project]
name = "aeropulse-regions"
version = "0.1.0"
description = "Region Packs, hazard profiles, and AQI standards for AeroPulse"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-common",
    "aeropulse-connector-sdk",
    "aeropulse-contracts",
    "aeropulse-geospatial",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
aeropulse-region = "aeropulse_regions.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
aeropulse-common = { workspace = true }
aeropulse-connector-sdk = { workspace = true }
aeropulse-contracts = { workspace = true }
aeropulse-geospatial = { workspace = true }
