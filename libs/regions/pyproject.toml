[project]
name = "aeropulse-regions"
version = "0.1.0"
description = "APAC region packs, hazard profiles, and AQI standards"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-observability",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
aeropulse-region = "aeropulse_regions.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
aeropulse-observability = { workspace = true }
