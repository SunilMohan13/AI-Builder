[project]
name = "aeropulse-connector-sdk"
version = "0.1.0"
description = "Plug-and-play connector SDK for AeroPulse data sources"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-common",
    "aeropulse-contracts",
    "pydantic>=2.10.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv.sources]
aeropulse-common = { workspace = true }
aeropulse-contracts = { workspace = true }
