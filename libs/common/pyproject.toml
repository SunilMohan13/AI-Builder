[project]
name = "aeropulse-common"
version = "0.1.0"
description = "Shared settings, IDs, hashing, and domain errors for AeroPulse"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-ulid>=3.0.0",
    "minio>=7.2.0",
    "structlog>=24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

