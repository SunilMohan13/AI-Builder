[project]
name = "aeropulse-observability"
version = "0.1.0"
description = "Structured logging and OpenTelemetry bootstrap for AeroPulse"
requires-python = ">=3.12"
dependencies = [
    "aeropulse-common",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "prometheus-client>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.uv.sources]
aeropulse-common = { workspace = true }
